<svg xmlns="http://www.w3.org/2000/svg" width="960" height="376" viewBox="0 0 960 376">
  <rect width="960" height="376" fill="#0b1020"/>
  <rect x="24" y="18" width="7" height="34" rx="2" fill="#38bdf8"/>
  <text x="42" y="45" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" letter-spacing="1">TrueNAS</text>
  <text x="910" y="40" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="end" letter-spacing="2">STORAGE OVERVIEW</text>
  <line x1="24" y1="72" x2="936" y2="72" stroke="#3a4a68" stroke-width="2"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#94a3b8">
    <text x="65" y="100">POOL</text><text x="335" y="100">READ</text><text x="665" y="100">WRITE</text>
  </g>
  <!-- Row 2 "DISK TEMP AVG"/"HOTTEST DISK" headers removed 2026-07-29:
       replaced by a live 5-column per-disk temp+health grid (monitor.json
       disk1..disk5_temp/_health_ok/_health_bad, x:65/239/413/587/761,
       y:280 temp / y:316 health) -- each disk's own name is embedded in
       its temp line ("sda 108°F"), so no separate header row is needed.
       See generate-storage-sensors.sh. -->
  <g fill="#38bdf8"><rect x="65" y="194" width="180" height="4" rx="2"/><rect x="335" y="194" width="180" height="4" rx="2"/><rect x="665" y="194" width="180" height="4" rx="2"/></g>
  <line x1="24" y1="216" x2="936" y2="216" stroke="#3a4a68" stroke-width="2"/>
  <!-- Footer status dot + "ONLINE"/state text (2026-07-29): moved from
       static SVG chrome to live monitor.json sensor fields (footer_dot_ok/
       _bad, footer_text_ok/_bad at x:24/y:366 and x:64/y:362) so it
       reflects real zpool health instead of always reading ONLINE/green.
       Computed once in generate-storage-sensors.sh, shared across all 3
       pages via asterctl's merged sensor keyspace. -->
  <!-- "AOOSTAR LCD" caption removed 2026-07-29: bottom-right is now
       the live ip_address sensor field (monitor.json, x:936/y:365,
       right-aligned), part of the shared footer row (dot+status left,
